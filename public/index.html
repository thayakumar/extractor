<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnyFlip to PDF</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* -- Layout: centered single-column app shell -- */
:root {
  --bg: #f4f2ed;
  --surface: #ffffff;
  --surface-raised: #faf9f6;
  --fg: #1c1b18;
  --fg-dim: #74716a;
  --accent: #bf5b2e;
  --accent-hover: #a44f27;
  --accent-soft: #fceee6;
  --success: #2a7a4c;
  --success-soft: #e6f4ec;
  --error-bg: #fdeae7;
  --error-fg: #8b2518;
  --border: #dbd8d0;
  --radius: 10px;
  --font: 'DM Sans', system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161510;
    --surface: #201e18;
    --surface-raised: #282620;
    --fg: #e6e3dc;
    --fg-dim: #8a877f;
    --accent: #de7a4a;
    --accent-hover: #ef8f5e;
    --accent-soft: #2c2117;
    --success: #48ab6c;
    --success-soft: #192e21;
    --error-bg: #2e1a17;
    --error-fg: #f0a89e;
    --border: #3a3730;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #161510;
  --surface: #201e18;
  --surface-raised: #282620;
  --fg: #e6e3dc;
  --fg-dim: #8a877f;
  --accent: #de7a4a;
  --accent-hover: #ef8f5e;
  --accent-soft: #2c2117;
  --success: #48ab6c;
  --success-soft: #192e21;
  --error-bg: #2e1a17;
  --error-fg: #f0a89e;
  --border: #3a3730;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--fg);
  min-height: 100vh;
  padding: 0 16px;
}

.app {
  max-width: 860px;
  margin: 0 auto;
  padding-block: 52px 80px;
}

.header { margin-bottom: 36px; }
.header h1 {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.4px;
  margin-bottom: 6px;
}
.header h1 span { color: var(--accent); }
.header p { color: var(--fg-dim); font-size: 14px; line-height: 1.5; }

.input-row {
  display: flex;
  gap: 10px;
  margin-bottom: 28px;
}
.input-row input {
  flex: 1;
  min-width: 0;
  padding: 13px 16px;
  font-family: var(--mono);
  font-size: 13.5px;
  background: var(--surface);
  color: var(--fg);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  outline: none;
  transition: border-color .15s;
}
.input-row input:focus { border-color: var(--accent); }
.input-row input::placeholder { color: var(--fg-dim); opacity: .55; }

.btn {
  padding: 13px 26px;
  font-family: var(--font);
  font-size: 14.5px;
  font-weight: 600;
  border: none;
  border-radius: var(--radius);
  cursor: pointer;
  transition: background .15s, opacity .15s;
  white-space: nowrap;
}
.btn-go { background: var(--accent); color: #fff; }
.btn-go:hover { background: var(--accent-hover); }
.btn-go:disabled { opacity: .45; cursor: not-allowed; }
.btn-dl { background: var(--success); color: #fff; }
.btn-dl:hover { opacity: .9; }

[hidden] { display: none !important; }

/* -- Status card -- */
.card {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 22px 24px;
  margin-bottom: 20px;
}
.book-row {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 18px;
}
.book-icon {
  width: 42px; height: 42px;
  border-radius: 8px;
  background: var(--accent-soft);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.book-icon svg { width: 20px; height: 20px; color: var(--accent); }
.book-title { font-weight: 600; font-size: 15px; line-height: 1.3; }
.book-pages { font-size: 12.5px; color: var(--fg-dim); margin-top: 2px; }

.prog-label {
  display: flex;
  justify-content: space-between;
  font-size: 12.5px;
  color: var(--fg-dim);
  margin-bottom: 7px;
}
.prog-track {
  height: 5px;
  background: var(--surface-raised);
  border-radius: 3px;
  overflow: hidden;
}
.prog-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  transition: width .25s ease;
  width: 0%;
}
.prog-fill.ok { background: var(--success); }

.status-line {
  margin-top: 10px;
  font-size: 12.5px;
  color: var(--fg-dim);
  font-family: var(--mono);
}

/* -- Done bar -- */
.done-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  background: var(--success-soft);
  border-radius: var(--radius);
  margin-bottom: 20px;
}
.done-dot {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--success);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.done-dot svg { width: 14px; height: 14px; color: #fff; }
.done-info { flex: 1; font-size: 13.5px; font-weight: 500; }

.error-box {
  padding: 14px 20px;
  background: var(--error-bg);
  color: var(--error-fg);
  border-radius: var(--radius);
  font-size: 13.5px;
  margin-bottom: 20px;
}

.preview iframe {
  width: 100%;
  height: 72vh;
  min-height: 420px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface-raised);
}

@media (max-width: 540px) {
  .input-row { flex-direction: column; }
  .btn { width: 100%; }
  .app { padding-block: 32px 60px; }
  .header h1 { font-size: 22px; }
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>AnyFlip <span>&rarr;</span> PDF</h1>
    <p>Paste any AnyFlip link. Pages are downloaded and assembled into a PDF you can preview and save.</p>
  </div>

  <div class="input-row">
    <input id="inp" type="url" placeholder="https://anyflip.com/tnvex/hdnr/" autofocus>
    <button id="go" class="btn btn-go" onclick="run()">Convert</button>
  </div>

  <div id="err" class="error-box" hidden></div>

  <div id="card" class="card" hidden>
    <div class="book-row">
      <div class="book-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
        </svg>
      </div>
      <div>
        <div id="btitle" class="book-title"></div>
        <div id="bpages" class="book-pages"></div>
      </div>
    </div>
    <div class="prog-label">
      <span id="plabel">Preparing...</span>
      <span id="pcount"></span>
    </div>
    <div class="prog-track"><div id="pfill" class="prog-fill"></div></div>
    <div id="sline" class="status-line"></div>
  </div>

  <div id="done" class="done-bar" hidden>
    <div class="done-dot">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <div id="dinfo" class="done-info"></div>
    <button class="btn btn-dl" onclick="save()">Download PDF</button>
  </div>

  <div id="pview" class="preview" hidden>
    <iframe id="frame"></iframe>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.2/jspdf.umd.min.js"></script>
<script>
const { jsPDF } = window.jspdf;
let pdfBlob = null;
let pdfName = "flipbook.pdf";

const $ = id => document.getElementById(id);

function reset() {
  $('err').hidden = true;
  $('card').hidden = true;
  $('done').hidden = true;
  $('pview').hidden = true;
  $('pfill').style.width = '0%';
  $('pfill').classList.remove('ok');
  pdfBlob = null;
}

function fail(msg) {
  $('err').textContent = msg;
  $('err').hidden = false;
  $('go').disabled = false;
  $('go').textContent = 'Convert';
}

async function run() {
  const url = $('inp').value.trim();
  if (!url) { $('inp').focus(); return; }

  reset();
  $('go').disabled = true;
  $('go').textContent = 'Converting...';
  $('card').hidden = false;
  $('plabel').textContent = 'Fetching book info...';
  $('pcount').textContent = '';
  $('sline').textContent = '';

  let cfg;
  try {
    const r = await fetch(`/api/config?url=${encodeURIComponent(url)}`);
    cfg = await r.json();
    if (cfg.error) throw new Error(cfg.error);
  } catch (e) {
    fail(e.message);
    return;
  }

  $('btitle').textContent = cfg.title;
  $('bpages').textContent = `${cfg.pages.length} pages`;
  $('plabel').textContent = 'Downloading pages...';
  pdfName = cfg.title.replace(/[^\w\s-]/g, '').trim().substring(0, 60) + '.pdf';

  // Download all images through proxy, with concurrency limit
  const images = new Array(cfg.pages.length);
  let done = 0;
  const CONCURRENCY = 6;

  async function downloadOne(i) {
    const imgUrl = `${cfg.baseUrl}/${cfg.pages[i]}`;
    const resp = await fetch(`/api/proxy?url=${encodeURIComponent(imgUrl)}`);
    if (!resp.ok) throw new Error(`Failed page ${i + 1}`);
    const blob = await resp.blob();
    // Convert to data URL for jsPDF
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  // Throttled parallel download
  let idx = 0;
  async function worker() {
    while (idx < cfg.pages.length) {
      const i = idx++;
      try {
        images[i] = await downloadOne(i);
      } catch {
        images[i] = null;
      }
      done++;
      const pct = Math.round((done / cfg.pages.length) * 100);
      $('pfill').style.width = pct + '%';
      $('pcount').textContent = `${done} / ${cfg.pages.length}`;
    }
  }

  try {
    await Promise.all(Array.from({ length: CONCURRENCY }, () => worker()));
  } catch (e) {
    fail(`Download failed: ${e.message}`);
    return;
  }

  // Assemble PDF
  $('plabel').textContent = 'Assembling PDF...';
  $('pcount').textContent = '';
  $('sline').textContent = 'Stitching pages together...';
  $('pfill').style.width = '100%';

  // Use requestAnimationFrame to let the UI update before heavy work
  await new Promise(r => requestAnimationFrame(() => setTimeout(r, 50)));

  try {
    const pw = cfg.pageWidth || 595;
    const ph = cfg.pageHeight || 842;
    // jsPDF uses mm by default; convert points to mm (1pt = 0.3528mm)
    const wMm = pw * 0.3528;
    const hMm = ph * 0.3528;

    const doc = new jsPDF({ orientation: wMm > hMm ? 'l' : 'p', unit: 'mm', format: [wMm, hMm] });

    let first = true;
    for (let i = 0; i < images.length; i++) {
      if (!images[i]) continue;
      if (!first) doc.addPage([wMm, hMm]);
      first = false;
      doc.addImage(images[i], 'WEBP', 0, 0, wMm, hMm);
    }

    pdfBlob = doc.output('blob');
  } catch (e) {
    fail(`PDF assembly failed: ${e.message}`);
    return;
  }

  // Done
  $('pfill').classList.add('ok');
  $('plabel').textContent = 'Complete';
  $('pcount').textContent = '';
  $('sline').textContent = '';

  const sizeMb = (pdfBlob.size / (1024 * 1024)).toFixed(1);
  $('dinfo').textContent = `${images.filter(Boolean).length} pages · ${sizeMb} MB`;
  $('done').hidden = false;

  // Preview
  const blobUrl = URL.createObjectURL(pdfBlob);
  $('frame').src = blobUrl;
  $('pview').hidden = false;

  $('go').disabled = false;
  $('go').textContent = 'Convert';
}

function save() {
  if (!pdfBlob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(pdfBlob);
  a.download = pdfName;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

$('inp').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
</script>
</body>
</html>
